name: Deploy on Production

on:
  push:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
          clean: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: print-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull $REGISTRY/$REPOSITORY:production || true
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:production .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:production

  deploy:
    permissions:
      id-token: write
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Teleport binaries
        uses: teleport-actions/setup@v1
        with:
          version: 13.0.3
      - name: Fetch credentials using Machine ID
        uses: teleport-actions/auth-k8s@v1
        with:
          proxy: teleport.urbanpiper.com:443
          token: github-token
          kubernetes-cluster: k8s-eks-prod
      - name: Switch proxy port
        run: |
          sed -i 's/teleport\.urbanpiper\.com:443/teleport\.urbanpiper\.com:3026/g' $KUBECONFIG
      - name: Checkout helm-charts repo
        uses: actions/checkout@v3
        with:
          repository: urbanpiper-engineering/helm-charts
          token: ${{ secrets.HELM_REPO_PAT }}
          ref: main
          path: .
      - name: Deploy on Production EKS
        uses: WyriHaximus/github-action-helm3@v3
        with:
          exec: helm upgrade --install --values ./charts/apps/print-service/values.prod.yaml print-service ./charts/apps/print-service --wait --atomic -n print-service
